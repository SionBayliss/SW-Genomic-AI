<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-head">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}#about">About</a>
    <a href="{{ '/' | relative_url }}#news">News &amp; events</a>
    <a class="btn small" href="{{ site.signup_url }}">Join the group</a>
  </nav>
</header>
<main>{{ content }}</main>
<footer class="site-foot">
  <p>{{ site.title }}, with members in Bath, Bristol, Cardiff and Exeter</p>
  <p><a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
</footer>
</body>
</html>
